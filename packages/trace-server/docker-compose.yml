version: '3.8'

services:
  # MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: tracker-mysql
    restart: always
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tracker_db
      MYSQL_USER: tracker
      MYSQL_PASSWORD: tracker123
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - tracker-network

  # Redis
  redis:
    image: redis:alpine
    container_name: tracker-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - tracker-network

networks:
  tracker-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data: