version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: traceflow-mysql
    restart: always
    ports:
      - ${MYSQL_PORT}:3306 # 从.env读取端口
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD} # 从.env读取
      MYSQL_DATABASE: ${MYSQL_DATABASE} # 从.env读取
      MYSQL_USER: ${MYSQL_USER} # 从.env读取
      MYSQL_PASSWORD: ${MYSQL_PASSWORD} # 从.env读取
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - tracker-network

  redis:
    image: redis:alpine
    container_name: tracker-redis
    restart: always
    ports:
      - ${REDIS_PORT}:6379 # 从.env读取端口
    volumes:
      - redis-data:/data
    networks:
      - tracker-network
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  tracker-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
