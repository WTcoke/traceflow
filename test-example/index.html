<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TraceFlow Test Example</title>
    <style>
      body {
        margin: 24px;
        font-family: Arial, sans-serif;
        color: #222;
      }
      h1 {
        margin-top: 0;
      }
      .form {
        max-width: 760px;
      }
      label {
        display: block;
        margin-top: 12px;
        margin-bottom: 6px;
        font-weight: 600;
      }
      input,
      textarea,
      button {
        font: inherit;
      }
      input,
      textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #bbb;
      }
      textarea {
        min-height: 100px;
        resize: vertical;
      }
      .actions {
        margin-top: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      button {
        padding: 8px 14px;
        cursor: pointer;
      }
      #status {
        margin-top: 16px;
        font-weight: 600;
      }
      pre {
        margin-top: 16px;
        padding: 12px;
        background: #111;
        color: #eee;
        min-height: 280px;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>TraceFlow Test Example</h1>
    <p>最小静态页面，用来验证 `trace-sdk -> trace-server` 链路。</p>

    <div class="form">
      <label for="baseUrl">Server Base URL</label>
      <input id="baseUrl" value="http://localhost:3000/api/v1" />

      <label for="projectId">Project ID</label>
      <input id="projectId" value="proj_local_demo" />

      <label for="appKey">App Key</label>
      <input id="appKey" value="app_key_local_demo" />

      <label for="appId">SDK App ID</label>
      <input id="appId" value="traceflow-demo-app" />

      <label for="eventName">Custom Event Name</label>
      <input id="eventName" value="static_page_probe" />

      <label for="eventProps">Custom Event Properties (JSON)</label>
      <textarea id="eventProps">{
  "source": "test-example",
  "scene": "manual-link-check"
}</textarea>

      <div class="actions">
        <button id="initBtn">Init SDK</button>
        <button id="pageBtn">Send Page Event</button>
        <button id="trackBtn">Send Custom Event</button>
        <button id="errorBtn">Send Error Event</button>
        <button id="healthBtn">Check Docs</button>
        <button id="clearBtn">Clear Log</button>
      </div>

      <div id="status">Status: idle</div>
      <pre id="logPanel">[boot] ready</pre>
    </div>

    <script src="/sdk/trace-sdk.iife.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
